name: Actualizar version.json

# Cada release publicada regenera docs/version.json (lo lee la app para avisar de
# actualizaciones) y copia el APK de Android a la página de GitHub Pages.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Copiar el APK de Android a la página
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p docs/download
          if gh release download "$TAG" -p "grammar-reviewer-android.apk" -D docs/download --clobber; then
            echo "has_apk=true" >> "$GITHUB_OUTPUT"
          else
            echo "La release no incluye APK de Android."
            echo "has_apk=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Escribir docs/version.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          HAS_APK: ${{ steps.apk.outputs.has_apk }}
        run: |
          VERSION="${TAG#v}"
          # La versión de Android solo cambia si la release trae su APK; escritorio y CLI se actualizan a mano al publicar sus instaladores.
          if [ "$HAS_APK" = "true" ]; then
            jq --arg v "$VERSION" --arg n "$NOTES" '.notes = $n | .android.version = $v' docs/version.json > docs/version.tmp.json
          else
            jq --arg n "$NOTES" '.notes = $n' docs/version.json > docs/version.tmp.json
          fi
          mv docs/version.tmp.json docs/version.json

      - name: Publicar cambios
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/version.json docs/download
          git commit -m "Actualizar version.json y APK a ${TAG}" || echo "Sin cambios que publicar."
          git push
